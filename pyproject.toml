[project]
name = "cadastre-gnaf"
version = "0.1.0"
description = "Australian state cadastres -> per-state flat CSV, keyed to G-NAF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyproj>=3.7.1",
    "requests>=2.31",
    "shapely>=2.1.2",
]

[project.optional-dependencies]
geo = [
    "geopandas>=0.14",
    "shapely>=2.0",
]

[project.scripts]
cadastre-gnaf = "cadastre_gnaf.cli.main:main"

[dependency-groups]
dev = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]   # zip(ring, ring[1:]) edge pairs are intentionally uneven
